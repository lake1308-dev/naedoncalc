<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연차수당 계산기 | 내돈계산</title><meta name="description" content="남은 연차일수와 1일 통상임금을 입력해 미사용 연차수당을 간편 계산하세요."><link rel="canonical" href="https://lake1308-dev.github.io/naedoncalc/annual-leave-pay.html"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">전체 계산기</a><a href="ordinary-wage.html">통상임금</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">미사용 연차</span><h1>연차수당 계산기</h1><p>남은 연차일수와 1일 통상임금을 입력해 미사용 연차수당을 간편 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>남은 연차일수<div class="input-unit"><input id="days" type="number" value="8"><span>일</span></div></label><label>1일 통상임금<div class="input-unit"><input id="daily" type="number" value="140000"><span>원</span></div></label><button class="calc-btn" onclick="calc()">연차수당 계산</button></div><div class="result-panel center-result"><span class="muted">예상 연차수당</span><div class="mega" id="out">0원</div></div></div><h2>계산식</h2><p><b>남은 연차일수 × 1일 통상임금</b>으로 단순 계산합니다. 통상임금 자체를 먼저 계산해야 한다면 통상임금 계산기를 이용할 수 있습니다.</p><h2>실제 지급 여부는 왜 다를 수 있나요?</h2><p>연차 발생일수, 사용 여부, 연차사용촉진 절차 등 개별 상황에 따라 실제 지급 대상과 금액이 달라질 수 있습니다.</p></article></main><footer><div class="wrap disclaimer">참고용 계산입니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){out.textContent=w(Math.max(0,+days.value||0)*Math.max(0,+daily.value||0))}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
