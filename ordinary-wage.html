<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통상임금·통상시급 계산기 | 내돈계산</title><meta name="description" content="기본급과 정기 수당, 정기상여를 입력해 통상임금과 통상시급을 간편 계산하고 연차·연장·야간근로수당까지 확인하세요."><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">계산기</a><a href="guide.html">가이드</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">통상임금 간편 계산</span><h1>통상임금·통상시급 계산기</h1><p>통상임금에 포함될 가능성이 있는 임금을 월 단위로 환산해 통상시급을 계산하고, 연차수당·연장근로수당까지 이어서 추정합니다.</p><div class="notice"><b>중요:</b> 개별 임금항목의 통상임금 포함 여부는 근로계약·취업규칙·지급조건에 따라 달라질 수 있습니다.</div><div class="calculator-grid"><div class="form-panel"><label>월 기본급<div class="input-unit"><input id="owBase" type="number" value="3000000"><span>원</span></div></label><label>매월 정기·일률적 수당<div class="input-unit"><input id="owAllowance" type="number" value="300000"><span>원</span></div></label><label>연간 정기상여 등 포함 예상액<div class="input-unit"><input id="owAnnualBonus" type="number" value="0"><span>원/년</span></div></label><label>월 산정 기준시간<div class="input-unit"><input id="owHours" type="number" value="209"><span>시간</span></div></label><label>미사용 연차<div class="input-unit"><input id="owLeaveDays" type="number" value="8"><span>일</span></div></label><label>연장근로<div class="input-unit"><input id="owOverHours" type="number" value="10"><span>시간</span></div></label><label>야간근로<div class="input-unit"><input id="owNightHours" type="number" value="0"><span>시간</span></div></label><button class="calc-btn" onclick="calcOrdinary()">계산하기</button></div><div class="result-panel"><div class="result-line"><span>월 통상임금 추정</span><strong id="owMonthly">0원</strong></div><div class="result-total"><span>통상시급 추정</span><strong id="owHourly">0원</strong></div><div class="result-line"><span>1일 8시간 통상임금</span><strong id="owDaily">0원</strong></div><div class="result-line"><span>연차수당 추정</span><strong id="owLeavePay">0원</strong></div><div class="result-line"><span>연장근로수당</span><strong id="owOverPay">0원</strong></div><div class="result-line"><span>야간 가산분</span><strong id="owNightPay">0원</strong></div></div></div></article></main><footer><div class="wrap disclaimer">계산 결과는 참고용입니다. © 2026 내돈계산</div></footer><script>const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원';const val=id=>Math.max(0,Number(document.getElementById(id).value)||0);function calcOrdinary(){const monthly=val('owBase')+val('owAllowance')+val('owAnnualBonus')/12,hours=Math.max(1,val('owHours')),hourly=monthly/hours,daily=hourly*8;owMonthly.textContent=won(monthly);owHourly.textContent=won(hourly);owDaily.textContent=won(daily);owLeavePay.textContent=won(daily*val('owLeaveDays'));owOverPay.textContent=won(hourly*1.5*val('owOverHours'));owNightPay.textContent=won(hourly*.5*val('owNightHours'))}window.addEventListener('DOMContentLoaded',calcOrdinary)</script></body></html>
