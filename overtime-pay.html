<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연장근로수당 계산기 | 내돈계산</title><meta name="description" content="통상시급과 연장근로시간, 가산배율을 입력해 예상 연장근로수당을 계산하세요."><link rel="canonical" href="https://lake1308-dev.github.io/naedoncalc/overtime-pay.html"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">전체 계산기</a><a href="ordinary-wage.html">통상임금</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">야근·연장근로</span><h1>연장근로수당 계산기</h1><p>통상시급과 연장근로시간을 입력해 예상 수당을 계산합니다. 기본값은 1.5배로 설정되어 있습니다.</p><div class="calculator-grid"><div class="form-panel"><label>통상시급<div class="input-unit"><input id="rate" type="number" value="15000"><span>원</span></div></label><label>연장근로시간<div class="input-unit"><input id="hours" type="number" value="10"><span>시간</span></div></label><label>계산 배율<select id="multi"><option value="1.5">1.5배</option><option value="2">2.0배</option></select></label><button class="calc-btn" onclick="calc()">수당 계산</button></div><div class="result-panel center-result"><span class="muted">예상 연장근로수당</span><div class="mega" id="out">0원</div></div></div><h2>계산식</h2><p><b>통상시급 × 연장근로시간 × 선택한 배율</b>로 계산합니다.</p><h2>야간·휴일근로가 함께 있다면?</h2><p>근로시간대와 휴일 여부에 따라 가산 구조가 달라질 수 있으므로 이 페이지는 단순 추정용으로 사용하세요.</p></article></main><footer><div class="wrap disclaimer">참고용 계산입니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){out.textContent=w(Math.max(0,+rate.value||0)*Math.max(0,+hours.value||0)*(+multi.value||1.5))}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
