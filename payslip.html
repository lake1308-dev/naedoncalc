<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>월급명세서 시뮬레이터 | 내돈계산</title><meta name="description" content="기본급, 수당, 비과세액, 세금을 입력해 예상 급여명세서와 실수령액을 한눈에 확인하세요."><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">계산기</a><a href="salary-net.html">실수령액</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">급여 한눈에 보기</span><h1>월급명세서 시뮬레이터</h1><div class="calculator-grid"><div class="form-panel"><label>기본급<div class="input-unit"><input id="base" type="number" value="3000000"><span>원</span></div></label><label>과세 수당<div class="input-unit"><input id="allow" type="number" value="300000"><span>원</span></div></label><label>비과세 수당<div class="input-unit"><input id="nt" type="number" value="200000"><span>원</span></div></label><label>소득세<div class="input-unit"><input id="it" type="number" value="0"><span>원</span></div></label><button class="calc-btn" onclick="calc()">명세서 만들기</button></div><div class="result-panel"><div class="result-line"><span>지급액 합계</span><strong id="gross">0원</strong></div><div class="result-line"><span>국민연금</span><strong id="p">0원</strong></div><div class="result-line"><span>건강보험</span><strong id="h">0원</strong></div><div class="result-line"><span>장기요양</span><strong id="c">0원</strong></div><div class="result-line"><span>고용보험</span><strong id="e">0원</strong></div><div class="result-line"><span>소득세+지방소득세</span><strong id="tax">0원</strong></div><div class="result-total"><span>차인지급액</span><strong id="net">0원</strong></div></div></div></article></main><footer><div class="wrap disclaimer">참고용 시뮬레이션입니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){let b=+base.value||0,a=+allow.value||0,n=+nt.value||0,g=b+a+n,t=b+a,pb=t===0?0:Math.min(6590000,Math.max(410000,t)),pp=pb*.0475,hh=t*.03595,cc=hh*.1314,ee=t*.009,ii=Math.max(0,+it.value||0),tt=ii*1.1;gross.textContent=w(g);p.textContent=w(pp);h.textContent=w(hh);c.textContent=w(cc);e.textContent=w(ee);tax.textContent=w(tt);net.textContent=w(g-pp-hh-cc-ee-tt)}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
