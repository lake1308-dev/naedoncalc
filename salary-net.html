<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 연봉·월급 실수령액 계산기 | 내돈계산</title><meta name="description" content="2026년 사회보험료를 반영해 월급 공제액과 예상 실수령액을 계산합니다."><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">계산기</a><a href="ordinary-wage.html">통상임금</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">2026 급여 계산</span><h1>연봉·월급 실수령액 계산기</h1><p>사회보험료를 계산하고 소득세는 개인별 부양가족 등에 따라 달라지므로 확인한 값을 직접 입력할 수 있습니다.</p><div class="calculator-grid"><div class="form-panel"><label>연봉<div class="input-unit"><input id="annual" type="number" value="42000000"><span>원</span></div></label><label>월 비과세액<div class="input-unit"><input id="nontax" type="number" value="200000"><span>원</span></div></label><label>월 소득세(모르면 0원)<div class="input-unit"><input id="incomeTax" type="number" value="0"><span>원</span></div></label><button class="calc-btn" onclick="calc()">계산하기</button></div><div class="result-panel"><div class="result-line"><span>월 세전급여</span><strong id="gross">0원</strong></div><div class="result-line"><span>국민연금</span><strong id="pension">0원</strong></div><div class="result-line"><span>건강보험</span><strong id="health">0원</strong></div><div class="result-line"><span>장기요양</span><strong id="care">0원</strong></div><div class="result-line"><span>고용보험</span><strong id="employment">0원</strong></div><div class="result-line"><span>소득세+지방소득세</span><strong id="tax">0원</strong></div><div class="result-total"><span>예상 월 실수령액</span><strong id="net">0원</strong></div></div></div></article></main><footer><div class="wrap disclaimer">계산 결과는 참고용입니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){let a=Math.max(0,+annual.value||0),g=a/12,nt=Math.max(0,+nontax.value||0),b=Math.max(0,g-nt);let pb=b===0?0:Math.min(6590000,Math.max(410000,b)),p=pb*.0475,h=b*.03595,c=h*.1314,e=b*.009,it=Math.max(0,+incomeTax.value||0),lt=it*.1,total=p+h+c+e+it+lt;gross.textContent=w(g);pension.textContent=w(p);health.textContent=w(h);care.textContent=w(c);employment.textContent=w(e);tax.textContent=w(it+lt);net.textContent=w(Math.max(0,g-total))}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
