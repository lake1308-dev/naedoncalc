<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 실업급여 예상액 계산기 | 내돈계산</title><meta name="description" content="2026년 구직급여 예상액과 가입기간별 소정급여일수를 반영한 실업급여 계산기입니다."><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">계산기</a><a href="guide.html">가이드</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">2026 구직급여</span><h1>실업급여 예상액 계산기</h1><p>이직 전 평균임금과 연령, 고용보험 가입기간을 넣으면 1일 구직급여와 예상 지급일수를 간편 계산합니다.</p><div class="calculator-grid"><div class="form-panel"><label>퇴직 전 1일 평균임금<div class="input-unit"><input id="avg" type="number" value="120000"><span>원</span></div></label><label>연령<select id="age"><option value="under50">50세 미만</option><option value="over50">50세 이상 또는 장애인</option></select></label><label>고용보험 가입기간<select id="period"><option value="0">1년 미만</option><option value="1">1~3년 미만</option><option value="2">3~5년 미만</option><option value="3">5~10년 미만</option><option value="4">10년 이상</option></select></label><label>1일 소정근로시간<div class="input-unit"><input id="hours" type="number" min="1" max="8" value="8"><span>시간</span></div></label><button class="calc-btn" onclick="calc()">예상액 계산</button></div><div class="result-panel"><div class="result-line"><span>평균임금의 60%</span><strong id="raw">0원</strong></div><div class="result-line"><span>적용 1일 구직급여</span><strong id="daily">0원</strong></div><div class="result-line"><span>예상 소정급여일수</span><strong id="days">0일</strong></div><div class="result-total"><span>전체 예상액</span><strong id="total">0원</strong></div></div></div><div class="notice">실제 수급자격은 이직사유, 피보험단위기간 등 별도 요건을 충족해야 합니다.</div></article></main><footer><div class="wrap disclaimer">실제 수급자격과 지급액은 고용센터 판단을 따릅니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){let a=Math.max(0,+avg.value||0),h=Math.min(8,Math.max(1,+hours.value||8)),r=a*.6,upper=68100,lower=10320*h*.8,d=Math.min(upper,Math.max(lower,r));let u=[120,150,180,210,240],o=[120,180,210,240,270],n=(age.value==='over50'?o:u)[+period.value];raw.textContent=w(r);daily.textContent=w(d);days.textContent=n+'일';total.textContent=w(d*n)}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
