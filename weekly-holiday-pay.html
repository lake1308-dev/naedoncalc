<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주휴수당 계산기 2026 | 내돈계산</title><meta name="description" content="시급과 주 소정근로시간을 입력해 주휴시간과 예상 주휴수당을 간편 계산하세요."><link rel="canonical" href="https://lake1308-dev.github.io/naedoncalc/weekly-holiday-pay.html"><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-mark">₩</span>내돈계산</a><nav><a href="index.html">전체 계산기</a><a href="minimum-wage.html">최저임금</a></nav></div></header><main class="wrap"><article class="page wide-page"><span class="eyebrow">아르바이트·직장인</span><h1>주휴수당 계산기</h1><p>시급과 주 소정근로시간을 입력하면 주 40시간 근무자의 8시간을 기준으로 주휴시간을 비례 환산해 예상 주휴수당을 보여줍니다.</p><div class="calculator-grid"><div class="form-panel"><label>시급<div class="input-unit"><input id="rate" type="number" value="10320"><span>원</span></div></label><label>주 소정근로시간<div class="input-unit"><input id="hours" type="number" value="20"><span>시간</span></div></label><button class="calc-btn" onclick="calc()">주휴수당 계산</button></div><div class="result-panel"><div class="result-line"><span>주휴시간</span><strong id="rest">0시간</strong></div><div class="result-total"><span>예상 주휴수당</span><strong id="pay">0원</strong></div></div></div><h2>간편 계산식</h2><p>주 15시간 이상을 입력한 경우, 최대 주 40시간 범위에서 <b>(주 소정근로시간 ÷ 40) × 8시간 × 시급</b>으로 계산합니다.</p><h2>주의사항</h2><p>실제 주휴일·주휴수당 발생 여부는 근로관계와 소정근로일 개근 여부 등 구체적인 조건에 따라 달라질 수 있습니다.</p></article></main><footer><div class="wrap disclaimer">참고용 계산입니다. © 2026 내돈계산</div></footer><script>const w=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';function calc(){const r=Math.max(0,+rate.value||0),h=Math.min(40,Math.max(0,+hours.value||0)),rh=h>=15?h/40*8:0;rest.textContent=rh.toFixed(1)+'시간';pay.textContent=w(r*rh)}window.addEventListener('DOMContentLoaded',calc)</script></body></html>
